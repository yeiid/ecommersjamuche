services:
  app:
    build: .
    container_name: ecommerce-astro
    ports:
      - "4330:4330"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4330
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: always

volumes:
  data:
